name: Lighthouse CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1-5"
  push:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.x autorun
